<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Andemik</title>

  <meta
    name="description"
    content="Andemik — fieldwork, laboratory research, and the conservation of endemic flora."
  >

  <meta name="robots" content="index, follow">

  <!-- Replace site.com with the real domain -->
  <link rel="canonical" href="https://site.com/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Andemik">
  <meta
    property="og:description"
    content="Andemik — fieldwork, laboratory research, and the conservation of endemic flora."
  >
  <meta property="og:url" content="https://site.com/">
  <meta property="og:image" content="https://site.com/og.jpg">

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Andemik">
  <meta
    name="twitter:description"
    content="Andemik — fieldwork, laboratory research, and the conservation of endemic flora."
  >
  <meta name="twitter:image" content="https://site.com/og.jpg">

  <meta name="theme-color" content="#f4f2ea">

  <style>
    :root {
      --background: #f4f2ea;
      --text: #171916;

      --page-margin: clamp(20px, 4vw, 64px);
      --image-gap: clamp(16px, 2vw, 32px);
      --label-gap: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;

      background: var(--background);
      color: var(--text);

      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* -------------------------
       Page
    ------------------------- */

    .site {
      min-height: 100vh;
      min-height: 100svh;

      display: grid;
      grid-template-rows: auto 1fr auto;

      padding:
        var(--page-margin)
        var(--page-margin)
        calc(var(--page-margin) * 0.8);
    }

    /* -------------------------
       Header
    ------------------------- */

    .header {
      display: flex;
      align-items: flex-start;
    }

    .wordmark {
      display: inline-block;

      font-size: 14px;
      line-height: 1;

      font-weight: 500;
      letter-spacing: 0.08em;
    }

    /* -------------------------
       Main
    ------------------------- */

    main {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sections {
      width: 100%;
      max-width: 1100px;

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));

      gap: var(--image-gap);

      margin-inline: auto;
    }

    .section {
      display: block;
      min-width: 0;
    }

    .image-wrap {
      width: 100%;
      aspect-ratio: 4 / 3;

      overflow: hidden;

      background: #e7e4da;
    }

    .section img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      transition:
        transform 500ms cubic-bezier(.2, .65, .25, 1);
    }

    .section-label {
      display: block;

      margin-top: var(--label-gap);

      text-align: center;

      font-size: 12px;
      line-height: 1;

      font-weight: 500;
      letter-spacing: 0.08em;

      text-transform: uppercase;
    }

    @media (hover: hover) {
      .section:hover img {
        transform: scale(1.015);
      }
    }

    .section:focus-visible {
      outline: 1px solid var(--text);
      outline-offset: 5px;
    }

    /* -------------------------
       Footer
    ------------------------- */

    .footer {
      display: grid;
      grid-template-columns: 1fr auto;

      align-items: end;

      font-size: 11px;
      line-height: 1.2;
      letter-spacing: 0.02em;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .footer a {
      transition: opacity 180ms ease;
    }

    .footer a:hover {
      opacity: 0.55;
    }

    .footer a:focus-visible {
      outline: 1px solid var(--text);
      outline-offset: 4px;
    }

    /* -------------------------
       Mobile
    ------------------------- */

    @media (max-width: 600px) {
      :root {
        --page-margin: 20px;
        --image-gap: 16px;
        --label-gap: 11px;
      }

      .wordmark {
        font-size: 13px;
      }

      .sections {
        max-width: none;
      }

      /* Keep Field and Lab side-by-side on mobile. */

      .image-wrap {
        aspect-ratio: 1 / 1.18;
      }

      .section-label {
        font-size: 10px;
      }

      .footer {
        font-size: 10px;
      }

      .footer-right {
        gap: 14px;
      }
    }

    @media (max-width: 340px) {
      :root {
        --page-margin: 16px;
        --image-gap: 12px;
      }

      .footer {
        font-size: 9px;
      }

      .footer-right {
        gap: 10px;
      }
    }

    /* -------------------------
       Reduced motion
    ------------------------- */

    @media (prefers-reduced-motion: reduce) {
      .section img,
      .footer a {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <div class="site">

    <header class="header">
      <a
        class="wordmark"
        href="/"
        aria-label="Andemik home"
      >
        ANDEMIK
      </a>
    </header>


    <main>
      <nav
        class="sections"
        aria-label="Andemik sections"
      >

        <a
          class="section"
          href="https://field.site.com"
          aria-label="Field"
        >
          <div class="image-wrap">
            <img
              src="/field.jpg"
              alt="Andemik fieldwork"
              loading="eager"
              decoding="async"
            >
          </div>

          <span class="section-label">
            Field
          </span>
        </a>


        <a
          class="section"
          href="https://lab.site.com"
          aria-label="Lab"
        >
          <div class="image-wrap">
            <img
              src="/lab.jpg"
              alt="Andemik laboratory research"
              loading="eager"
              decoding="async"
            >
          </div>

          <span class="section-label">
            Lab
          </span>
        </a>

      </nav>
    </main>


    <footer class="footer">

      <div class="footer-left">
        <span>© 2026</span>
        <span>ANDEMIK</span>
      </div>

      <nav
        class="footer-right"
        aria-label="Legal"
      >
        <a href="/terms.html">Terms</a>
        <a href="/privacy.html">Privacy</a>
      </nav>

    </footer>

  </div>

</body>
</html>
